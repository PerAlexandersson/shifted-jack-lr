[package]
name = "shifted-jack-lr"
version = "0.1.0"
edition = "2021"
description = "Exact shifted Jack Littlewood-Richardson coefficients and data generation"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/shifted-jack-lr"
repository = "https://github.com/PerAlexandersson/shifted-jack-lr"
keywords = ["jack", "symmetric-functions", "combinatorics"]

[lib]
name = "shifted_jack_lr"
path = "src/lib.rs"

[[bin]]
name = "shifted-jack-lr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
